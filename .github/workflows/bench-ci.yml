# merget-harness live benchmark CI: the recipe the benchmark VM discovered for
# this corpus, run on every pull request, on main and on sema's batch branches.
# The corpus's own workflows are removed on the mirror (docs/SCENARIOS.md "bench").
name: bench-ci
on:
  push:
    branches:
      - "main"
      - "sema/queue/**"
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest "werkzeug<2.3"
      - run: pytest -q -x
